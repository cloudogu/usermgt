{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "usermgt.fullname" . }}-deny-all
  labels:
    {{- include "usermgt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "usermgt.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
